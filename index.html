<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/nekolog.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NekoLog</title>
</head>

<body>
  <div id="root"></div>

  <div class="footer-links">
    <a href="https://github.com/isofurabon/NekoLog" target="_blank" rel="noopener noreferrer">GitHub</a>
    <span class="separator">|</span>
    <a href="THIRD-PARTY-NOTICES.txt" download="THIRD-PARTY-NOTICES.txt">Third Party Notices</a>
  </div>
  <style>
    .footer-links {
      position: fixed;
      bottom: 2px;
      right: 8px;
      display: flex;
      gap: 8px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ctp-overlay0, #6c7086);
      opacity: 0.6;
      transition: opacity 0.2s;
      z-index: 9999;
    }

    .footer-links:hover {
      opacity: 1;
    }

    .footer-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--ctp-text, #cdd6f4);
      text-decoration: underline;
    }
  </style>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
