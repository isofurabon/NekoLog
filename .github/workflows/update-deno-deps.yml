name: Update Deno 

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Update dependencies
        run: |
          deno run -A jsr:@molt/cli --write deno.json
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update deno dependencies"
          title: "chore: update deno dependencies"
          body: |
            Updates Deno dependencies in `deno.json`.
            
            Auto-generated by [molt](https://jsr.io/@molt/cli) and GitHub Actions.
          branch: "deno-deps-update"
          delete-branch: true
