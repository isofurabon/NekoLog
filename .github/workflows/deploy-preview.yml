name: Deploy Preview

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write # Required for Deno Deploy authentication
  contents: read
  pull-requests: write # Required to comment on PRs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build with Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "v0.19.11"
          verb: call
          args: -m dagger build-web --source . --base-path / -o ./dist
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Deploy to Deno Deploy (Preview)
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno deploy --project=nekolog --exclude=node_modules --static-dir=dist .
