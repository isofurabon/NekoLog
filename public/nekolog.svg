<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Cat face -->
  <circle cx="50" cy="55" r="35" fill="url(#catGradient)"/>
  <!-- Left ear -->
  <polygon points="20,35 15,5 40,25" fill="url(#catGradient)"/>
  <!-- Right ear -->
  <polygon points="80,35 85,5 60,25" fill="url(#catGradient)"/>
  <!-- Inner left ear -->
  <polygon points="22,30 20,12 35,25" fill="#A78BFA"/>
  <!-- Inner right ear -->
  <polygon points="78,30 80,12 65,25" fill="#A78BFA"/>
  <!-- Left eye -->
  <ellipse cx="35" cy="50" rx="8" ry="10" fill="#1E1B4B"/>
  <!-- Right eye -->
  <ellipse cx="65" cy="50" rx="8" ry="10" fill="#1E1B4B"/>
  <!-- Eye shine left -->
  <circle cx="38" cy="47" r="3" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="68" cy="47" r="3" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="65" rx="5" ry="4" fill="#1E1B4B"/>
  <!-- Mouth -->
  <path d="M50,69 Q45,76 40,72" stroke="#1E1B4B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50,69 Q55,76 60,72" stroke="#1E1B4B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="10" y1="55" x2="30" y2="60" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="10" y1="65" x2="30" y2="65" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="12" y1="75" x2="30" y2="70" stroke="#1E1B4B" stroke-width="1.5"/>
  <!-- Whiskers right -->
  <line x1="90" y1="55" x2="70" y2="60" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="90" y1="65" x2="70" y2="65" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="88" y1="75" x2="70" y2="70" stroke="#1E1B4B" stroke-width="1.5"/>
</svg>
